name: Build SkyWhy Client

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Unzip gradle wrapper if needed
        run: |
          # Проверяем и распаковываем gradle-wrapper.jar.zip если он есть
          if [ -f gradle/wrapper/gradle-wrapper.jar.zip ]; then
            echo "Found gradle-wrapper.jar.zip, extracting..."
            unzip -o gradle/wrapper/gradle-wrapper.jar.zip -d gradle/wrapper/
            rm gradle/wrapper/gradle-wrapper.jar.zip
          fi
          # Проверяем и распаковываем gradle.zip если он есть в корне
          if [ -f gradle.zip ]; then
            echo "Found gradle.zip, extracting..."
            unzip -o gradle.zip -d ./
            rm gradle.zip
          fi
          # Проверяем и распаковываем gradle-wrapper.zip если он есть в корне
          if [ -f gradle-wrapper.zip ]; then
            echo "Found gradle-wrapper.zip, extracting..."
            unzip -o gradle-wrapper.zip -d ./
            rm gradle-wrapper.zip
          fi
          # Устанавливаем права на выполнение
          chmod +x gradlew
        shell: bash

      - name: Verify gradle wrapper exists
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "✅ gradle-wrapper.jar exists"
          else
            echo "❌ gradle-wrapper.jar NOT FOUND!"
            exit 1
          fi
        shell: bash

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace
        shell: bash

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyWhy-Client
          path: build/libs/*.jar
          retention-days: 30
